<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鲁轩毓 - AI应用开发 / Prompt工程 / 智能体开发</title>
    <style>
        /* ========== CSS变量与主题 ========== */
        :root {
            --primary: #1e40af;
            --primary-light: #3b82f6;
            --primary-dark: #1e3a5f;
            --primary-soft: #dbeafe;
            --accent: #f59e0b;
            --accent-soft: #fef3c7;
            --accent-dark: #d97706;
            --bg: #f8fafc;
            --bg-texture: radial-gradient(circle at 20% 30%, rgba(30, 64, 175, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.04) 0%, transparent 50%);
            --surface: #ffffff;
            --surface-hover: #f1f5f9;
            --text: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.12);
            --shadow-primary: 0 4px 20px rgba(30, 64, 175, 0.25);
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --radius-full: 9999px;
            --nav-height: 64px;
            --transition-fast: 150ms ease;
            --transition-base: 200ms ease;
            --transition-slow: 250ms ease;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Consolas", "Monaco", "Courier New", monospace;
        }

        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-light: #60a5fa;
            --primary-dark: #93c5fd;
            --primary-soft: #1e293b;
            --accent: #fbbf24;
            --accent-soft: #292524;
            --accent-dark: #f59e0b;
            --bg: #0f172a;
            --bg-texture: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(245, 158, 11, 0.04) 0%, transparent 50%);
            --surface: #1e293b;
            --surface-hover: #334155;
            --text: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border: #334155;
            --border-light: #1e293b;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.5);
            --shadow-primary: 0 4px 20px rgba(59, 130, 246, 0.35);
        }

        /* ========== 基础重置 ========== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: var(--nav-height);
            -webkit-text-size-adjust: 100%;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-stack);
            font-size: 16px;
            line-height: 1.7;
            color: var(--text);
            background: var(--bg);
            background-image: var(--bg-texture);
            background-attachment: fixed;
            transition: background-color var(--transition-base), color var(--transition-base);
            min-height: 100vh;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition-fast);
        }
        a:hover {
            color: var(--primary-light);
        }

        button {
            font-family: var(--font-stack);
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
            font-size: inherit;
            transition: all var(--transition-fast);
        }

        img,
        svg {
            display: block;
            max-width: 100%;
        }

        ul,
        ol {
            list-style: none;
        }

        /* ========== 容器 ========== */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ========== 导航栏 ========== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            z-index: 1000;
            background: var(--surface);
            border-bottom: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            transition: background-color var(--transition-base), border-color var(--transition-base), box-shadow var(--transition-base);
            display: flex;
            align-items: center;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 16px;
        }
        .nav-brand {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text);
            letter-spacing: -0.01em;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-brand .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: inline-block;
            flex-shrink: 0;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .nav-links::-webkit-scrollbar {
            display: none;
        }
        .nav-link {
            padding: 8px 14px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-secondary);
            border-radius: var(--radius-full);
            white-space: nowrap;
            transition: color var(--transition-fast), background-color var(--transition-fast);
        }
        .nav-link:hover,
        .nav-link.active {
            color: var(--primary);
            background: var(--primary-soft);
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid var(--border);
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }
        .icon-btn:hover {
            background: var(--surface-hover);
            color: var(--primary);
            border-color: var(--primary);
        }
        .icon-btn svg {
            width: 18px;
            height: 18px;
        }
        .hamburger {
            display: none;
            width: 38px;
            height: 38px;
            border-radius: var(--radius-full);
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            background: transparent;
            border: 1px solid var(--border);
            flex-shrink: 0;
            flex-direction: column;
            gap: 4px;
        }
        .hamburger span {
            display: block;
            width: 18px;
            height: 2px;
            background: currentColor;
            border-radius: 2px;
            transition: all var(--transition-base);
        }
        .hamburger.open span:nth-child(1) {
            transform: translateY(6px) rotate(45deg);
        }
        .hamburger.open span:nth-child(2) {
            opacity: 0;
            transform: scaleX(0);
        }
        .hamburger.open span:nth-child(3) {
            transform: translateY(-6px) rotate(-45deg);
        }
        .mobile-menu {
            display: none;
            position: fixed;
            top: var(--nav-height);
            left: 0;
            right: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            padding: 12px 24px;
            z-index: 999;
            flex-direction: column;
            gap: 4px;
            transform: translateY(-8px);
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition-base);
        }
        .mobile-menu.open {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
            display: flex;
        }
        .mobile-menu .nav-link {
            display: block;
            padding: 12px 16px;
            font-size: 0.95rem;
            border-radius: var(--radius-sm);
        }

        /* ========== Hero区 ========== */
        .hero {
            padding: calc(var(--nav-height) + 48px) 0 48px;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 40%, #1e3a5f 100%);
            color: #fff;
            position: relative;
            overflow: hidden;
            transition: background var(--transition-base);
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -20%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .hero .container {
            position: relative;
            z-index: 1;
        }
        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-full);
            padding: 6px 16px;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            margin-bottom: 20px;
        }
        .hero-badge .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.4);
            }
        }
        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 8px;
        }
        .hero .hero-subtitle {
            font-size: 1.15rem;
            font-weight: 500;
            opacity: 0.9;
            margin-bottom: 16px;
            letter-spacing: 0.01em;
        }
        .hero .hero-desc {
            font-size: 0.98rem;
            line-height: 1.8;
            opacity: 0.82;
            max-width: 640px;
            margin-bottom: 24px;
        }
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 28px;
        }
        .hero-tag {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-full);
            padding: 5px 14px;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            transition: background var(--transition-fast), transform var(--transition-fast);
            cursor: default;
        }
        .hero-tag:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateY(-2px);
        }
        .hero-cta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: var(--radius-full);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            transition: all var(--transition-base);
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary {
            background: #fff;
            color: var(--primary-dark);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
            background: #f8fafc;
        }
        .btn-outline {
            background: transparent;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.35);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-3px);
        }
        .btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        /* ========== Section通用 ========== */
        .section {
            padding: 56px 0;
            transition: background-color var(--transition-base);
        }
        .section-header {
            text-align: center;
            margin-bottom: 36px;
        }
        .section-header .section-eyebrow {
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .section-header h2 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 8px;
        }
        .section-header .section-divider {
            width: 48px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 3px;
            margin: 0 auto;
        }

        /* ========== 亮点成果区 ========== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .highlight-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 24px 20px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-slow);
            position: relative;
            overflow: hidden;
        }
        .highlight-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity var(--transition-base);
        }
        .highlight-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border);
        }
        .highlight-card:hover::before {
            opacity: 1;
        }
        .highlight-number {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--primary);
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .highlight-number .unit {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-dark);
        }
        .highlight-label {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        /* ========== Tabs通用 ========== */
        .tabs-container {
            width: 100%;
        }
        .tablist {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--border-light);
            margin-bottom: 24px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tablist::-webkit-scrollbar {
            display: none;
        }
        .tab {
            padding: 12px 20px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-secondary);
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            white-space: nowrap;
            transition: all var(--transition-fast);
            position: relative;
            letter-spacing: 0.01em;
        }
        .tab:hover {
            color: var(--primary);
            background: var(--surface-hover);
        }
        .tab[aria-selected="true"] {
            color: var(--primary);
            border-bottom-color: var(--primary);
            background: var(--primary-soft);
        }
        .tab:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: -2px;
            border-radius: var(--radius-sm);
        }
        .tabpanel {
            animation: fadeIn 0.25s ease;
        }
        .tabpanel[hidden] {
            display: none;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ========== 经历区 ========== */
        .timeline {
            position: relative;
            padding-left: 32px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 4px;
            bottom: 4px;
            width: 2px;
            background: var(--border);
            border-radius: 2px;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 28px;
        }
        .timeline-item:last-child {
            padding-bottom: 0;
        }
        .timeline-dot {
            position: absolute;
            left: -32px;
            top: 6px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            border: 3px solid var(--surface);
            box-shadow: 0 0 0 3px var(--primary-soft);
            z-index: 1;
            transition: all var(--transition-base);
        }
        .timeline-item:hover .timeline-dot {
            transform: scale(1.2);
            box-shadow: 0 0 0 5px var(--primary-soft);
        }
        .timeline-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 20px 24px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-slow);
        }
        .timeline-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--border);
        }
        .timeline-card h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .timeline-card .timeline-org {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 2px;
        }
        .timeline-card .timeline-date {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 10px;
            display: inline-block;
            background: var(--primary-soft);
            padding: 2px 12px;
            border-radius: var(--radius-full);
        }
        .timeline-card .timeline-desc {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.65;
        }
        .timeline-card .timeline-desc ul {
            list-style: disc;
            padding-left: 20px;
            margin-top: 6px;
        }
        .timeline-card .timeline-desc li {
            margin-bottom: 2px;
        }

        /* 证书卡片网格 */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .cert-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 20px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-slow);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cert-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--border);
        }
        .cert-card .cert-name {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.4;
        }
        .cert-card .cert-org {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--primary);
        }
        .cert-card .cert-date {
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .cert-card .cert-id {
            font-size: 0.72rem;
            font-family: var(--font-mono);
            color: var(--text-muted);
            background: var(--surface-hover);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            display: inline-block;
            align-self: flex-start;
        }
        .cert-card .cert-note {
            font-size: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.55;
            font-style: italic;
            border-top: 1px dashed var(--border-light);
            padding-top: 8px;
            margin-top: 4px;
        }

        /* ========== 项目区 ========== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .project-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-slow);
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
            overflow: hidden;
        }
        .project-card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, var(--primary-soft) 0%, transparent 70%);
            border-radius: 0 0 0 80px;
            opacity: 0;
            transition: opacity var(--transition-base);
        }
        .project-card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-lg);
            border-color: var(--border);
        }
        .project-card:hover::after {
            opacity: 1;
        }
        .project-card .project-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.01em;
        }
        .project-card .project-stack {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .project-card .project-stack .stack-tag {
            font-size: 0.72rem;
            font-weight: 600;
            background: var(--primary-soft);
            color: var(--primary);
            padding: 3px 12px;
            border-radius: var(--radius-full);
            letter-spacing: 0.03em;
        }
        .project-card .project-desc {
            font-size: 0.87rem;
            color: var(--text-secondary);
            line-height: 1.65;
            flex-grow: 1;
        }
        .project-card .project-link {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--primary);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: gap var(--transition-fast);
        }
        .project-card .project-link:hover {
            gap: 8px;
            color: var(--primary-light);
        }

        /* ========== 技能矩阵 ========== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .skill-category {

            background: linear-gradient(90deg, var(--primary), var(--accent));
            transition: width 0.6s ease;
            position: relative;
        }
        .skill-bar .skill-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 12px;
            background: rgba(255, 255, 255, 0.35);
            border-radius: 0 3px 3px 0;

            bottom: 28px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-primary);
            z-index: 900;
            opacity: 0;
            pointer-events: none;
            transform: translateY(12px);

        }

            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);

            background: var(--primary-light);

            /* ==================== DOM引用 ==================== */
            const $ = (sel, ctx) => (ctx || document).querySelector(sel);
            const $$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));

            /* ==================== 工具函数 ==================== */
            function createEl(tag, attrs = {}, children = []) {
                const el = document.createElement(tag);
                Object.entries(attrs).forEach(([k, v]) => {
                    if (k === 'class') el.className = v;
                    else if (k === 'html') el.innerHTML = v;
                    else if (k === 'dataset') Object.entries(v).forEach(([dk, dv]) => el.dataset[dk] = dv);
                    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
                    else if (k === 'style') el.style.cssText = v;
                    else el.setAttribute(k, v);
                });
                children.forEach(c => {
                    if (typeof c === 'string') el.appendChild(document.createTextNode(c));
                    else if (c) el.appendChild(c);
                });
                return el;
            }

            function escapeHTML(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function debounce(fn, ms) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), ms);
                };
            }

            function showToast(msg) {
                const toast = $('#toast');
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('show'), 2200);
            }

            function getPreferredTheme() {
                const stored = localStorage.getItem('theme');
                if (stored === 'light' || stored === 'dark') return stored;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme);
                const sunIcon = $('#icon-sun');
                const moonIcon = $('#icon-moon');
                if (theme === 'dark') {
                    sunIcon.style.display = 'none';
                    moonIcon.style.display = 'block';
                } else {

                    moonIcon.style.display = 'none';

            }

            /* ==================== Tabs渲染（通用） ==================== */
            function createTabs(containerId, tablistId, panelsId, tabsData, panelRenderer) {
                const tablist = $('#' + tablistId);
                const panelsContainer = $('#' + panelsId);
                if (!tablist || !panelsContainer) return;

                tablist.innerHTML = '';
                panelsContainer.innerHTML = '';

                tabsData.forEach((tab, index) => {
                    const tabBtn = createEl('button', {
                        class: 'tab',
                        role: 'tab',
                        id: tablistId + '-tab-' + index,
                        'aria-controls': tablistId + '-panel-' + index,
                        'aria-selected': index === 0 ? 'true' : 'false',
                        'tabindex': index === 0 ? '0' : '-1',
                        'data-index': index,
                        html: escapeHTML(tab.label)
                    });
                    tablist.appendChild(tabBtn);

                    const panel = createEl('div', {
                        class: 'tabpanel',
                        role: 'tabpanel',
                        id: tablistId + '-panel-' + index,
                        'aria-labelledby': tablistId + '-tab-' + index,
                        'tabindex': '0'
                    });
                    if (index !== 0) panel.setAttribute('hidden', '');
                    panel.innerHTML = '';
                    panelRenderer(tab, panel);
                    panelsContainer.appendChild(panel);
                });

                // Tab点击事件
                $$('.tab', tablist).forEach(tabBtn => {
                    tabBtn.addEventListener('click', () => {
                        activateTab(tablistId, parseInt(tabBtn.dataset.index));
                    });
                });

                // 键盘导航（左右箭头）
                tablist.addEventListener('keydown', (e) => {
                    const tabs = $$('.tab', tablist);
                    if (!tabs.length) return;
                    const currentIndex = tabs.findIndex(t => t.getAttribute('aria-selected') === 'true');
                    let newIndex = currentIndex;

                    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                        e.preventDefault();
                        if (e.key === 'ArrowRight') newIndex = (currentIndex + 1) % tabs.length;
                        else newIndex = (currentIndex - 1 + tabs.length) % tabs.length;
                    } else if (e.key === 'Home') {
                        e.preventDefault();
                        newIndex = 0;
                    } else if (e.key === 'End') {
                        e.preventDefault();
                        newIndex = tabs.length - 1;
                    }

                    if (newIndex !== currentIndex) {
                        activateTab(tablistId, newIndex);
                        tabs[newIndex].focus();
                    }
                });
            }

            function activateTab(tablistId, index) {
                const tablist = $('#' + tablistId);
                if (!tablist) return;
                const tabs = $$('.tab', tablist);
                const panels = $$('.tabpanel', $('#' + tablistId.replace('-tablist', '-panels')) || document);
                tabs.forEach((tab, i) => {
                    const isActive = i === index;
                    tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
                    tab.setAttribute('tabindex', isActive ? '0' : '-1');
                });
                panels.forEach((panel, i) => {
                    if (i === index) panel.removeAttribute('hidden');
                    else panel.setAttribute('hidden', '');
                });
            }

            /* ==================== 淡入动画观察器 ==================== */
            function initFadeInObserver() {
                if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    $$('.fade-in-up').forEach(el => el.classList.add('visible'));
                    return;
                }
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.add('visible');
                            observer.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.08, rootMargin: '0px 0px -20px 0px' });
                // 初始渲染后观察
                setTimeout(() => {
                    $$('.fade-in-up').forEach(el => observer.observe(el));
                }, 100);
                // 也观察未来动态添加的
                window._fadeObserver = observer;
            }

            function observeNewFadeEls() {
                if (window._fadeObserver && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    $$('.fade-in-up:not(.visible)').forEach(el => window._fadeObserver.observe(el));
                }
            }

                    const isOpen = mobileMenu.classList.contains('open');
                    mobileMenu.classList.toggle('open');
                    hamburger.classList.toggle('open');
                    hamburger.setAttribute('aria-expanded', !isOpen ? 'true' : 'false');
                });

                // 移动端菜单点击后关闭
                $$('.mobile-menu .nav-link').forEach(link => {
                    link.addEventListener('click', () => {
                        mobileMenu.classList.remove('open');
                        hamburger.classList.remove('open');
                        hamburger.setAttribute('aria-expanded', 'false');
                    });
                });

                // 滚动高亮导航
                const sections = ['about', 'highlights', 'experience', 'projects', 'skills', 'education'];
                const navLinks = $$('.nav-link[data-anchor]');
                const scrollHandler = debounce(() => {
                    const scrollY = window.scrollY + 120;
                    let currentSection = '';
                    sections.forEach(id => {
                        const sec = document.getElementById(id);
                        if (sec && sec.offsetTop <= scrollY) currentSection = id;
                    });
                    navLinks.forEach(link => {
                        link.classList.toggle('active', link.dataset.anchor === currentSection);
                    });
                }, 80);
                window.addEventListener('scroll', scrollHandler, { passive: true });
                scrollHandler();
            }

                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        showToast('📋 邮箱已复制到剪贴板');
                    }
                });
            }

            /* ==================== 打印 ==================== */
            function initPrint() {
                $('#print-btn').addEventListener('click', () => {
                    window.print();
                });
            }

            /* ==================== 初始化 ==================== */
            function init() {
                // 主题
                applyTheme(getPreferredTheme());
                $('#theme-toggle').addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-theme');
                    applyTheme(current === 'dark' ? 'light' : 'dark');
                });

                // 渲染各部分
                renderHero();
                renderHighlights();
                renderExperience();
                renderProjects();
                renderSkills();
                renderEducation();

                // 交互
                initNavigation();
                initBackToTop();
                initEmailCopy();
                initPrint();

                // 淡入动画
                initFadeInObserver();

                // 响应系统主题变化
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                    if (!localStorage.getItem('theme')) {
                        applyTheme(e.matches ? 'dark' : 'light');
                    }
                });

                // 控制台防误操作
                console.log('%c 鲁轩毓 - 简历网站 ', 'background:#1e40af;color:#fff;font-size:14px;font-weight:bold;padding:6px 12px;border-radius:4px;');
                console.log('%c AI应用开发 | Prompt工程 | 智能体开发 ', 'color:#f59e0b;font-size:12px;');
            }

            // DOM就绪后初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }
        })();
    </script>
</body>
</html>
